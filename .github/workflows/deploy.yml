name: Deploy to Cloudflare

# Production deploy on push to master; a preview deploy for every pull
# request, with its HTTPS URL posted as a PR comment. Camera, motion and
# orientation APIs only work in a secure context, so every deployment —
# preview included — is served over HTTPS by Cloudflare (Workers static
# assets; Pages is now part of Workers).
#
# One-time setup (see docs/deployment.md):
#   - `npx wrangler deploy` once from a logged-in machine creates the Worker
#   - add repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and
#     CLOUDFLARE_ACCOUNT_ID
#   - optionally set IMMERSAL_API_KEY / VENUE_JSON_URL as repository variables
#     or secrets to bake into the build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # manual redeploy of master

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test

  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview deploy' || 'Production deploy' }}
    needs: checks
    runs-on: ubuntu-latest
    # Forked PRs cannot read secrets; skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ github.event_name == 'pull_request' && steps.preview.outputs.url || 'https://brains-js.henrypeti-dev.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts

      # Until the Cloudflare secrets are added (docs/deployment.md) there is
      # nothing to deploy to; say so instead of failing the run.
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy (see docs/deployment.md)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.creds.outputs.configured == 'true'
        env:
          IMMERSAL_API_KEY: ${{ secrets.IMMERSAL_API_KEY }}
          VENUE_JSON_URL: ${{ vars.VENUE_JSON_URL }}
          VENUE_BASE_URL: ${{ vars.VENUE_BASE_URL }}
          RUNTIME_CONFIG_URL: ${{ vars.RUNTIME_CONFIG_URL }}
          POSITIONING_PROVIDER: ${{ vars.POSITIONING_PROVIDER }}
        run: npm run build

      # Production: `wrangler deploy`. Preview: upload a version with a preview
      # alias named after the PR branch → https://<alias>-brains-js.<subdomain>.workers.dev
      - name: Preview alias
        if: github.event_name == 'pull_request'
        id: alias
        run: |
          alias=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default wrangler predates static-assets config; use a current one.
          wranglerVersion: '4.135.0'
          command: >-
            ${{ github.event_name == 'pull_request'
              && format('versions upload --preview-alias={0} --message="PR #{1}"', steps.alias.outputs.alias, github.event.pull_request.number)
              || 'deploy' }}

      - name: Resolve preview URL
        if: github.event_name == 'pull_request' && steps.creds.outputs.configured == 'true'
        id: preview
        env:
          OUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          # wrangler prints "Version Preview Alias URL: https://<alias>-brains-js.<subdomain>.workers.dev"
          url=$(printf '%s' "$OUT" | grep -o 'Version Preview Alias URL: https://[^ ]*' | head -1 | sed 's/.*: //')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request' && steps.creds.outputs.configured == 'true'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const body = `${marker}\n**Preview deployed:** ${process.env.URL}\n\nHTTPS is required for camera and motion access; open it on a phone to test positioning.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
